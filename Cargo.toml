[package]
name = "discord-user-rs"
version = "0.6.1"
edition = "2021"
description = "Discord self-bot client library — user-token WebSocket gateway and REST API, with an optional full-featured CLI client (archive + send/edit/react/threads/roles/bans/…)"
license = "MIT"
repository = "https://github.com/lengoclongk59/discord-user-rs"
homepage = "https://github.com/lengoclongk59/discord-user-rs"
documentation = "https://docs.rs/discord-user-rs"
authors = ["lengoclongk59 <lengoclongk59@gmail.com>"]
readme = "README.md"
keywords = ["discord", "self-bot", "websocket", "gateway"]
categories = ["api-bindings", "asynchronous", "network-programming"]

[lib]
name = "discord_user"

[[bin]]
name = "discord"
path = "src/bin/discord.rs"
required-features = ["cli"]

# ── Feature flags ─────────────────────────────────────────────────────────────
[features]
default = ["collector", "builder", "cache", "framework"]

## Stream-based event collectors (MessageCollector, ReactionCollector, …).
collector = ["dep:async-stream"]

## Type-state builder helpers (CreateMessage<HasChannel>, etc.).
builder = []

## In-memory event-driven cache (guilds, users, messages) + CacheHttp trait.
cache = []

## Built-in command framework (prefix commands, before/after hooks).
framework = []

## Use SIMD-accelerated JSON parsing (simd-json) instead of serde_json for
## gateway message deserialization.  Requires a CPU with AVX2 (most x86-64
## CPUs from 2013+).  The public API is unchanged; the switch is internal.
simd_json = ["dep:simd-json"]

## Build the bundled `discord` archival CLI binary. Pulls in clap, rusqlite,
## comfy-table, and other CLI-only dependencies; the library itself stays
## untouched. Build with `cargo build --features cli --bin discord`.
cli = [
    "dep:clap",
    "dep:rusqlite",
    "dep:dotenvy",
    "dep:anyhow",
    "dep:comfy-table",
    "dep:colored",
    "dep:indicatif",
    "dep:serde_yaml",
    "dep:aes-gcm",
    "dep:secrecy",
    "dep:zeroize",
    "dep:tempfile",
    "dep:tracing-subscriber",
    "dep:windows",
]

## Enable all optional features.
full = ["collector", "builder", "cache", "framework"]

[dependencies]
# Async runtime
tokio = { version = "1.48.0", features = ["full", "tracing"] }
futures = "0.3"

# WebSocket
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "gzip"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_repr = "0.1"

# Utilities
bitflags = { version = "2.6", features = ["serde"] }
uuid = { version = "1.0", features = ["v4"] }
rand = "0.9"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
thiserror = "1.0"
url = "2.5"
urlencoding = "2.1"
base64 = "0.22"
dashmap = "6.1.0"
flate2 = "1.0"

# Optional — gateway / lib features
async-stream = { version = "0.3", optional = true }
simd-json = { version = "0.13", optional = true, default-features = false, features = ["serde_impl"] }

# Optional — CLI feature (`cli`)
clap = { version = "4", features = ["derive"], optional = true }
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
dotenvy = { version = "0.15", optional = true }
anyhow = { version = "1", optional = true }
comfy-table = { version = "7", optional = true }
colored = { version = "2", optional = true }
indicatif = { version = "0.17", optional = true }
serde_yaml = { version = "0.9", optional = true }
aes-gcm = { version = "0.10", optional = true }
secrecy = { version = "0.10", optional = true }
zeroize = { version = "1", optional = true }
tempfile = { version = "3", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"], optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
], optional = true }

# `tokio_unstable` is set by this repository's `.cargo/config.toml` (for
# tokio-console) and gates the named-task path in `events.rs`; declaring it
# keeps the gate from tripping `unexpected_cfgs`.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tokio = { version = "1.48.0", features = ["full"] }
tempfile = "3"
walkdir = "2"
